# Supabase project configuration for Onyx LMS v2.
#
# This file exists in v2 and did not in v1, for one reason: registering the
# Custom Access Token Hook. ADR-011 records it as "an operational step outside
# repo control" -- a checkbox in the dashboard that nobody can review, diff, or
# reproduce on a new project. Since v2 stands up its own project, the hook is
# declared here and applied with `supabase config push`, so provisioning a
# further environment is a command rather than a memory.
#
# NOTE ON SCOPE: `supabase config push` pushes this whole file and resets keys
# it does not find to CLI defaults -- there is no `config pull` or `config diff`
# to reconcile against. So values below are stated EXPLICITLY rather than left
# implicit, even where they match a default. Do not delete a key to "leave it
# alone"; deleting it changes it.
project_id = "pnhsnpxrxxphgjmrqoia"

[auth]
# Where a link in a GoTrue email points.
#
# This said localhost:5175 on the grounds that the app signs in through its own
# routes and never relies on a redirect. That was true until student
# registration shipped: GoTrue now sends a real person a real email, and every
# one of them carried `redirect_to=http://localhost:5175` -- a link to a dev
# server on the recipient's own machine. Nothing broke, because the product
# reads the CODE rather than the link, but the mail was telling somebody to
# visit their own laptop.
site_url = "https://onyx-lms-v2.vercel.app"
additional_redirect_urls = ["https://onyx-lms-v2.vercel.app", "http://localhost:5175"]

# Institutions are provisioned by the platform team, never self-served -- the
# signup page says so and is deliberately inert. Leaving GoTrue's own signup
# open would create accounts with no membership, which RLS treats as "read
# nothing" but which still clutter auth.users and can log in.
enable_signup = false

# Access tokens are short-lived and refreshed; the hook re-resolves membership
# on every mint, so a role change or removal takes effect on the next refresh
# rather than the next login.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# TRUE, and it must stay true. This key does not mean "allow self-signup by
# email" -- it enables the email provider itself, so setting it false returned
# `422 email_provider_disabled` on every password sign-in and locked the whole
# product out of its own database. Self-signup is blocked by `enable_signup`
# under [auth] above, which is a different switch; the Admin API creates
# accounts regardless of either.
enable_signup = true
# No SMTP is configured on this project, so confirmation mail would silently
# never arrive and every provisioned account would be stuck unverified.
# Accounts are created by the Admin API with email_confirm: true instead.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
# Both of these are stated because the first `config push` proved the warning at
# the top of this file: they were absent, so the push reset them to CLI defaults
# -- max_frequency from 1m to 1s (an email rate-limit loosening) and otp_length
# from 8 to 6. Restored, and now explicit so a future push cannot move them.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# The mail a learner actually receives when they register.
#
# GoTrue sends this template for `signInWithOtp`, which is what startSignUp
# calls. Supabase's default contains a LINK AND NOTHING ELSE, and this product
# asks for a CODE -- so the registration form had a box for digits and the mail
# had no digits in it. Registration was impossible on a deployment that
# otherwise reported everything as working: the API said "we have sent a code",
# GoTrue sent one, and the message it composed left the code out.
#
# Verified by registering to a readable mailbox and reading the message, which
# is the only way this class of fault can be caught. "Sent" and "usable" are
# different claims about an email.
# BLOCKED, and this is the block:
#
#   Email template modification is not available for free tier projects using
#   the default email provider. Please upgrade your plan or configure a custom
#   SMTP provider.
#
# That is Supabase's answer to `config push`, verbatim, and it rejects the
# WHOLE auth patch -- rate limits and site_url included -- so the block is
# commented out rather than left to fail. Uncomment it the moment custom SMTP
# is configured (see [auth.email.smtp] below) and push again; the template
# itself is correct and sitting in supabase/templates/magic-link.html.
#
# Until then student registration cannot complete: the form asks for a code and
# the shared sender's template contains only a link.
#
# UNBLOCKED THE MOMENT the SMTP block below is live: the refusal above applies
# to projects on the DEFAULT sender. Uncomment these three lines in the same
# edit that uncomments the SMTP block, and push once.
#
# [auth.email.template.magic_link]
# subject = "Your registration code"
# content_path = "./supabase/templates/magic-link.html"

# ZeptoMail (Zoho), India data centre.
#
# Mail used to leave from noreply@mail.app.supabase.io -- Supabase's shared
# built-in sender. It is rate-limited to a handful of messages an hour, is
# explicitly not for production, and it is why the registration template above
# was refused. A cohort registering on results day exhausted it in under a
# minute; worse, the shared sender's template carries a LINK and this product
# asks for a CODE, so registration could not complete at all.
#
# Both problems are the same problem, and this block is the fix for both.
#
# Why `.in` and not `.com`: the bounce CNAME issued for this domain points at
# cluster89.zeptomail.in, which is ZeptoMail's Indian DC. Sending through the
# wrong region's host authenticates against an account that does not exist
# there.
#
# `user` really is the literal string `emailapikey` -- ZeptoMail's SMTP
# username is fixed and the token goes in `pass`. Getting these the wrong way
# round produces an authentication failure that reads like a bad password.
#
# The token is an env reference, never a literal: this file is committed, and
# `config push` resolves the reference at push time from the environment.
#
# `admin_email` MUST be on the domain verified in ZeptoMail -- the one carrying
# the DKIM TXT at <selector>._domainkey and the bounce CNAME. ZeptoMail refuses
# to send From an unverified domain, and the refusal arrives as an SMTP error
# GoTrue reports as a generic send failure.
# READY, NOT LIVE. Two things are missing and both are outside this repository:
#
#   1. A verified sending domain. It cannot be onyx-lms-v2.vercel.app -- that
#      zone is served by ns1..4.vercel-dns-3.com, which is Vercel's, so the
#      DKIM TXT and the bounce CNAME ZeptoMail asks for cannot be created there
#      by anybody. It has to be a domain whose DNS we control.
#   2. The ZeptoMail Send Mail token, as ZEPTOMAIL_SMTP_TOKEN in the
#      environment `supabase config push` runs in.
#
# Left commented until both exist, for the reason the previous version of this
# comment gave and which still holds: `config push` resolves a missing `env()`
# to an EMPTY STRING rather than refusing, so an uncommented block without the
# token pushes "SMTP enabled, no credentials" and takes registration mail down
# entirely -- worse than the shared sender it replaces.
#
# When both are in hand: uncomment this block AND the magic_link template
# block above, then `supabase config push`. One push, because the template is
# only accepted once the project is off the default sender.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.zeptomail.in"          # .in, not .com -- the bounce CNAME issued
#                                      # for this account points at
#                                      # cluster89.zeptomail.in, ZeptoMail's
#                                      # Indian DC. The wrong region's host
#                                      # authenticates against an account that
#                                      # does not exist there.
# port = 587
# user = "emailapikey"                # A literal, not a placeholder. ZeptoMail's
#                                      # SMTP username is fixed; only the token
#                                      # varies. Swapping these two produces an
#                                      # auth failure that reads like a bad
#                                      # password.
# pass = "env(ZEPTOMAIL_SMTP_TOKEN)"
# admin_email = "noreply@<verified-domain>"   # MUST be on the domain verified in
#                                      # ZeptoMail. It refuses any other From,
#                                      # and the refusal reaches a learner as
#                                      # "we could not send your code".
# sender_name = "Onyx LMS"

# What an institution can do at once.
#
# Signing in costs TWO calls to GoTrue -- the password grant, then the refresh
# that scopes the session to an institution -- so the default of 30 sign-ins
# per five minutes is really 15 people, and a hall of forty starting an exam
# together walks into it. They are told to wait rather than accused of a wrong
# password, but they still do not get in, and an institution behind one NAT is
# one IP address as far as this limit is concerned.
#
# `email_sent` is raised with it because registration mail is subject to the
# same arithmetic on the day a cohort signs up -- though the binding limit
# there is still the SENDER, not this number: Supabase's built-in SMTP is a
# shared, heavily-rate-limited service that is explicitly not for production.
# Custom SMTP is the real fix; the block above is written and waiting on a
# verified domain and a token.
[auth.rate_limit]
sign_in_sign_ups = 300
token_refresh = 300
token_verifications = 300
email_sent = 100

# The reason this file exists.
#
# GoTrue has no concept of Onyx's tenancy, so tenant_id / tenant_role / platform
# are injected into the token at mint time by a Postgres function. Without this
# registered, sign-in succeeds and every tenant-scoped read then behaves as if
# the caller belongs to no institution -- which reads as "the data is gone"
# rather than "the token is missing a claim".
#
# The function is created by supabase/onyx/migrations/0015_auth_claims_hook.sql
# (and amended by 0016), in the `onyx` schema, with EXECUTE granted to
# supabase_auth_admin -- both verified present before this was pushed.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/onyx/custom_access_token_hook"

# OAuth Server Mode -- Onyx acting as an OAuth 2.1 / OIDC provider.
#
# Enabled because v1's project has it and v2 must not quietly lose a feature:
# the platform console's OAuth clients screen reads
# `/auth/v1/admin/oauth/clients`, and with this off GoTrue answers 404, the
# service turns that into a 502, and the page renders a 500. Confirmed by
# querying both projects directly -- v1 answered 200, v2 answered 404 -- so this
# was a real parity gap rather than a code difference.
#
# `config push` DOES NOT APPLY THIS BLOCK. Applied via the Management API instead.
#
# The keys below are the ones `supabase init` documents, and they are spelled
# correctly -- but `config push` (checked on 2.111.0 and 2.114.0) reports
# `auth: up_to_date` and sends nothing, because oauth_server is part of the CLI's
# local-development config and not of what it pushes to a hosted project. It fails
# by doing nothing rather than by saying so, which is the worst way to fail; the
# only way to know is to re-query the endpoint, which is how this was caught.
#
# So it was set through the Management API directly:
#
#   PATCH https://api.supabase.com/v1/projects/<ref>/config/auth
#   { "oauth_server_enabled": true,
#     "oauth_server_allow_dynamic_registration": true,
#     "oauth_server_authorization_path": "/oauth/authorize" }
#
# Those exact values were read off v1's project first rather than guessed, so the
# two match. Verified afterwards: the registry endpoint went 404 -> 200 and the
# platform console's OAuth clients page went 500 -> 200.
#
# The block stays because it is the correct declaration, a later CLI may push it,
# and a setting recorded in the repo is one somebody can find -- where a setting
# living only in a dashboard is one nobody knows exists until a page 500s.
[auth.oauth_server]
enabled = true
# Where GoTrue hosts the consent screen. Stated explicitly like every other value
# in this file -- `config push` resets unlisted keys to CLI defaults.
authorization_url_path = "/oauth/consent"
# Third-party apps register themselves against GoTrue's own endpoint; the console
# screen exists for visibility and revocation, never for performing registration.
allow_dynamic_registration = true
