# Render Blueprint -- the Onyx API.
#
# Only apps/api lives here. The web app is on Vercel, and the two halves talk
# over HTTP: this service must know the site's origin (WEB_ORIGIN, which is what
# CORS is built from) and the site must know this service's URL (API_URL), or
# every Onyx page fetches into nothing.
#
# NO SECRET VALUES IN THIS FILE. It is committed to a public repository, so
# every credential is `sync: false` -- Render prompts for it once, in the
# dashboard, and stores it there. A key pasted here would be public the moment
# it is pushed, and rotating a Supabase service-role key is not a small job.
services:
  - type: web
    name: onyx-api
    runtime: node
    plan: free
    # Nearest region to the database, which moved to ap-south-1 (Mumbai).
    # Putting the API in Oregon would reinstate exactly the round trip that
    # move was made to remove.
    region: singapore
    healthCheckPath: /health

    # Installed from the REPOSITORY ROOT, not apps/api: this is an npm
    # workspace and @onyx/api depends on @onyx/core and @onyx/types, which only
    # resolve when the root install links them.
    #
    # There is no build step. @onyx/core's entry point is src/index.ts and the
    # server is started as .ts directly, relying on Node's built-in type
    # stripping -- which is also why NODE_VERSION below is not optional.
    buildCommand: npm install
    startCommand: node apps/api/src/server.ts

    envVars:
      # Type stripping is on by default from 22.18. On Node 20 the process dies
      # at the first import with an unparsable-token error, which reads like a
      # syntax error in our code rather than the wrong runtime.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production

      # Render injects PORT and the server already reads it; it is listed so
      # nobody "helpfully" hardcodes 4000 here later.
      - key: PORT
        value: "10000"

      # The Vercel site's origin, exactly -- scheme and host, no trailing
      # slash. Left unset, @fastify/cors falls back to reflecting any origin,
      # which combined with credentials:true is far more open than intended.
      - key: WEB_ORIGIN
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # The Code Lab queue talks to Postgres directly rather than through
      # PostgREST, so it needs a connection string as well as the REST keys.
      # Leaving it out does not fail the boot -- the API serves fine -- it makes
      # the worker throw "Missing SUPABASE_DB_URL" every two seconds forever,
      # which is a quieter failure and a worse one.
      #
      # It must be the POOLER host, not db.<ref>.supabase.co: the direct host is
      # IPv6-only on projects created after early 2024 and Render's egress is
      # IPv4, so the direct URL fails to resolve from the container. Shape:
      #   postgresql://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # with the password percent-encoded (a raw @ breaks URI parsing).
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_REGION
        value: ap-south-1
      # Bypasses RLS. Server-side only -- this is the one that must never reach
      # a browser or a repository.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Per-project, and load-bearing beyond signing our own tokens: PostgREST
      # verifies the tokens we mint with the project's copy of this secret. A
      # value from the wrong project 401s every RLS-scoped read while the data
      # looks perfectly healthy.
      - key: SUPABASE_JWT_SECRET
        sync: false

      - key: ACCESS_TOKEN_TTL
        value: "3600"
      - key: REFRESH_TOKEN_TTL
        value: "1209600"
      - key: STORAGE_BUCKET
        value: uploads

      # Judge0's free hosted endpoint: rate-limited and no SLA, which is fine
      # for a demo and is not a production arrangement.
      - key: ONYX_JUDGE0_URL
        value: https://ce.judge0.com
