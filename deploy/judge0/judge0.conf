# Judge0 configuration for Onyx Code Lab.
#
# Onyx sends its limits explicitly on every submission -- CPU, wall clock,
# memory, processes, output, and enable_network: false -- because a server with
# generous defaults is indistinguishable from a working one until something goes
# wrong. These are the ceilings the server enforces on top of that: a submission
# may ask for less than the maximum and may not ask for more.
#
# The two numbers to understand before changing anything:
#
#   * MAX_PROCESSES_AND_OR_THREADS is what stops a fork bomb. Onyx asks for 32.
#   * ALLOW_ENABLE_NETWORK is the one that matters most. Onyx never asks for
#     network, but this is the setting that means it could not have it anyway --
#     and the API's own database sits on the network a sandbox would reach.

REDIS_HOST=redis
REDIS_PASSWORD=judge0

POSTGRES_HOST=db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# How many submissions run at once. Match it to cores, not to hope: the queue in
# front of this (LAB-02b) is what absorbs a class of 200 submitting together,
# and over-subscribing here turns a latency problem into a timeout problem.
COUNT=2

# ---------------------------------------------------------------------------
# Ceilings
# ---------------------------------------------------------------------------

CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=10
CPU_EXTRA_TIME=0.5
MAX_CPU_EXTRA_TIME=2

WALL_TIME_LIMIT=6
MAX_WALL_TIME_LIMIT=20

MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=512000

STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

MAX_PROCESSES_AND_OR_THREADS=32
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=8192

# ---------------------------------------------------------------------------
# The refusals
# ---------------------------------------------------------------------------

# Not "we do not ask for it" -- "it cannot be asked for". There is no
# caller-facing way to turn network on in Onyx either; this is the second lock.
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Waiting synchronously is how the adapter is written (wait=true), and it is
# right for a classroom: a learner pressing Run wants an answer, and the durable
# queue in front of this is what handles load rather than a second queue here.
ENABLE_WAIT_RESULT=true

# Nothing about a submission needs to outlive the answer.
ENABLE_SUBMISSION_DELETE=true
SUBMISSION_CACHE_DURATION=1

# Batched submissions are not used by Onyx and are an easy way to bypass a
# per-request limit somebody added later.
MAX_SUBMISSION_BATCH_SIZE=1

# The callback machinery lets a submission name a URL the worker will request.
# Onyx never uses it, and a sandbox that makes outbound HTTP on instruction is
# most of the way back to having network access.
ENABLE_CALLBACKS=false
